; ============================================================
; platformio.ini — Altura Rally Computer v2.2.5
; Target:    ESP32-2432S028R (Cheap Yellow Display / CYD)
; Platform:  espressif32 @ ~6.9.0  →  ESP32 Arduino Core 3.3.7 / IDF 5.3
;
; v2.2.5 changes vs previous working file:
;   platform pinned to ~6.9.0 for Core 3.3.7 / IDF 5.x
;   -DARDUINO_USB_CDC_ON_BOOT=0 retained (required for Core 3.x UART serial)
;   -DUSE_HSPI_PORT added — required for correct SPI bus routing on CYD
;   -DSPI_READ_FREQUENCY and -DSPI_TOUCH_FREQUENCY added — touch stability
;   -DDSEG14_36 added — font 3 (DSEG14) guard was missing from prior file
;   All other flags, paths, scripts, and lib_deps preserved from working file
; ============================================================

[env:esp32dev]
platform  = espressif32 @ ~6.9.0
board     = esp32dev
framework = arduino
monitor_speed = 115200

; Flash overclock — safe on Sunton ESP32-2432S028R
board_build.f_flash = 80000000L
board_build.flash_mode = qio

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
    ; Required for Core 3.x — disables CDC-over-USB boot mode, keeps UART0 as
    ; Serial. Without this, Serial output is silent on Core 3.x boards that
    ; don't have native USB serial.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_USE_SCALE=1
    -DLV_USE_LINE=1

    ; --- LVGL ---
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    ; Resolves 'undefined reference to lv_tft_espi_create' in LVGL 9 / PlatformIO
    -I .pio/libdeps/esp32dev/lvgl/src/drivers/display/tft_espi
    -DLV_USE_TFT_ESPI=1

    ; --- Custom Fonts ---
    -DLV_FONT_B612_36
    -DLV_FONT_DSEG14_36
    -DLV_FONT_DSEG7_36
    -DLV_FONT_DIN1451_36

    ; --- Hardware & Backlight ---
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=1

    ; --- TFT_eSPI Settings for CYD (Sunton ESP32-2432S028R, HSPI) ---
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTOUCH_CS=33
    -DUSE_HSPI_PORT
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

    ; --- TFT_eSPI built-in font loading ---
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1

extra_scripts = pre:remove_bad_files.py

lib_deps =
    slashdevin/NeoGPS @ ^4.2.9
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    lvgl/lvgl @ 9.2.2
